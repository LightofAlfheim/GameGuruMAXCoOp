; Launcher settings - the export writes this from Co-op Settings; this copy is an example.
; Put it next to "Play.exe" in the exported game folder.
; title: the heading in the launcher window (default: the game exe's name).
title=
; accent: button colour as #RRGGBB (default #6E0B0B, a dark blood red).
accent=
; host: what the "Connect by address" box starts with - for playing without Steam, e.g. your
; VPN address (e.g. Radmin VPN) or public IP (optionally :port). Leave empty to have players type it.
host=
; port: UDP port for hosting/joining by address (forward this one if you use port forwarding).
port=27015
; game: the game's exe, only needed if the folder has more than one.
;game=MyGame.exe
